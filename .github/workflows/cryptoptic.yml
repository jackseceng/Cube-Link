---
name: Cryptographic Inventory

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  read-all

jobs:
  scan:
    name: Scan (${{ matrix.language }})
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run cryptoptic scan
        id: cryptoptic
        uses: nationwide-group-oss/cryptoptic@58e45717959a1c0d38fa293f12d78ec35e2f922d # main
        with:
          command: scan
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          target-language: ${{ matrix.language }}
          output-directory: cryptoptic-results

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: ${{ steps.cryptoptic.outputs.results-directory }}
          category: cryptoptic-${{ matrix.language }}

      - name: Convert SARIF to CSV
        uses: nationwide-group-oss/cryptoptic@58e45717959a1c0d38fa293f12d78ec35e2f922d # main
        with:
          command: convert
          sarif-file: ${{ steps.cryptoptic.outputs.results-directory }}/org-sarif/${{ matrix.language }}/results.sarif
          output-file: cryptoptic-results/cbom-${{ matrix.language }}.csv
